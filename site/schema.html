<style>
/* Той самий стиль, що й на головній: старий папір, чорнило, латунь, сургуч; Playfair Display + IBM Plex Sans */
:root{
  --desk:#e6d6b0; --desk-warm:#efe3c6; --paper:#f4ecdd; --card:#fbf6ea; --manila:#f4ecdd; --manila-edge:#d9c088; --tape:#e8d4a0;
  --ink:#241c12; --ink-soft:#5e4e36; --brass:#c9a15a; --brass-dk:#7a5c26; --wax:#c8372d; --red:#b02e25; --string:#c8372d;
  --shadow:0 1px 0 rgba(36,28,18,.12), 0 12px 26px rgba(70,45,15,.28);
  --body:"IBM Plex Sans", system-ui, sans-serif; --head:"Playfair Display", Georgia, serif; --code:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0; color:var(--ink); font:16px/1.5 var(--body); overflow-x:hidden;
  background:radial-gradient(ellipse 110% 60% at 50% 0%, rgba(201,161,90,.10), transparent 70%),
    radial-gradient(rgba(36,28,18,.05) 1px, transparent 1.6px) 0 0/7px 7px, linear-gradient(var(--desk-warm), var(--desk) 40%)}
.wrap{max-width:1000px; margin:0 auto; padding:28px 16px 72px}
.paper{background:var(--paper); box-shadow:var(--shadow), inset 0 0 0 1px rgba(36,28,18,.08); border-radius:2px}
.back{display:inline-block; padding:7px 15px; border:1.5px solid var(--ink); border-radius:999px; background:var(--card);
  color:var(--ink); font:600 14px var(--body); text-decoration:none}
.back:hover{background:var(--ink); color:var(--card)}
.back:focus-visible, .lang button:focus-visible{outline:3px solid var(--wax); outline-offset:2px}
.topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.lang{display:inline-flex; border:1.5px solid var(--ink); border-radius:999px; overflow:hidden; font:600 12px var(--body); background:var(--card)}
.lang button{border:0; background:transparent; color:var(--ink); padding:6px 12px; cursor:pointer; letter-spacing:.08em; font:inherit}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--card)}

/* обкладинка */
.folder{position:relative; margin-top:44px; padding:30px clamp(18px,4vw,40px) 28px; border-radius:2px 12px 2px 2px; box-shadow:var(--shadow);
  border-bottom:6px solid var(--manila-edge);
  background:radial-gradient(ellipse at 80% 40%, rgba(255,255,255,.35), transparent 60%), repeating-linear-gradient(0deg, rgba(36,28,18,.018) 0 2px, transparent 2px 4px), var(--manila)}
.folder::before{content:""; position:absolute; top:-24px; left:26px; width:200px; height:26px; background:var(--manila); border-radius:12px 12px 0 0}
.case-no{font:600 13px var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--brass-dk)}
.folder h1{margin:10px 0 12px; font:700 clamp(36px,6.4vw,64px)/1.04 var(--head); letter-spacing:-.015em}
.folder p{margin:0; max-width:42em; color:var(--ink-soft); font-size:clamp(16px,2.2vw,18px)}
.stamp{position:absolute; top:26px; right:26px; font:700 15px/1 var(--body); letter-spacing:.16em; text-transform:uppercase; color:var(--wax);
  border:3px double var(--wax); padding:8px 12px 6px; border-radius:3px; opacity:.85; transform:rotate(8deg); mix-blend-mode:multiply}

/* заголовки розділів */
main{counter-reset:exhibit}
.section{margin-top:60px; counter-increment:exhibit}
.tape{margin:0 0 6px; padding:0 0 12px; font:700 clamp(28px,4.6vw,40px)/1.08 var(--head); letter-spacing:-.01em; border-bottom:1px solid rgba(36,28,18,.28)}
.tape::before{content:"№ " counter(exhibit, decimal-leading-zero); display:block; margin-bottom:10px; font:600 12px/1 var(--body); letter-spacing:.16em; color:var(--brass-dk)}
.hint{display:block; margin:8px 0 24px; color:var(--ink-soft)}

/* аркуші зі схемами */
.sheet{position:relative; padding:24px clamp(10px,2.5vw,26px)}
.sheet .pin{position:absolute; top:-9px; left:50%; width:18px; height:18px; margin-left:-9px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e0574b, var(--wax) 55%, #7d1f18); box-shadow:0 3px 5px rgba(0,0,0,.45)}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
.scroll > svg{min-width:460px}
.scroll > #erd{min-width:560px}
#flow{display:block; width:100%; height:auto}
#flow .t{font:600 15px var(--body); fill:var(--ink)}
#flow .f{font:500 13.5px var(--code); fill:var(--ink)}
#flow .ts{font:400 12.5px var(--body); fill:var(--ink-soft)}
#flow .src rect{fill:var(--card); stroke:var(--ink); stroke-width:1.2}
#flow .script rect{fill:#efdfb4; stroke:var(--ink); stroke-width:1.2}
#flow .site rect{fill:#f3d2c6; stroke:var(--ink); stroke-width:1.2}
#flow .db{fill:var(--tape); stroke:var(--ink); stroke-width:1.2; stroke-dasharray:6 4}
#flow .inner rect{fill:var(--card); stroke:var(--ink); stroke-width:1}
#flow .str{fill:none; stroke:var(--string); stroke-width:2.2; stroke-linecap:round}
#erd{font-family:var(--body)}
#erd svg{display:block; margin:0 auto; max-width:100%; height:auto}
.erd-fallback{font:15px var(--body); color:var(--ink-soft); padding:20px; text-align:center}

/* нотатки — клаптики старого паперу на шпильках */
.notes{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:34px 26px; margin-top:40px}
.note{position:relative; margin:0; padding:24px 20px 22px; color:var(--ink); transform:rotate(var(--tilt)); filter:drop-shadow(0 5px 6px rgba(70,45,15,.3)); isolation:isolate}
.note::before{content:""; position:absolute; inset:0; z-index:-1; background-color:#f1e6cb;
  background-image:repeating-linear-gradient(to bottom, transparent 0 21px, rgba(70,110,170,.08) 21px 22px);
  clip-path:polygon(0 1%,18% 0,41% 1.4%,66% 0,100% .8%,99% 22%,100% 48%,98.6% 74%,100% 96%,84% 99%,70% 96.5%,55% 100%,38% 97%,22% 99.5%,7% 96.8%,0 99%,1.6% 70%,0 40%,1.2% 16%)}
.note::after{content:""; position:absolute; top:-7px; left:50%; width:16px; height:16px; margin-left:-8px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e0574b, var(--wax) 55%, #7d1f18); box-shadow:0 3px 4px rgba(0,0,0,.4)}
.note h3{margin:0 0 6px; font:700 21px/1.15 var(--head)}
.note p{margin:0; font-size:15px; line-height:1.5}
.note code{font:13px var(--code); background:rgba(36,28,18,.07); padding:0 4px; border-radius:2px}
footer{margin-top:60px; text-align:center}
@media (max-width:700px){ .stamp{position:static; display:inline-block; margin-top:14px; transform:rotate(-4deg)} }
</style>
</head>

    rel: ['from card', 'category', 'subcategory', 'where it goes'],
    f: {names: 'Карта 1, Карта 3 (спільна)...', type: 'credit or debit', share: '0.5 = half', holder: 'who paid', desc: 'bank text', merchant: 'merchant',
        amount: 'amount, cents', orig: 'in card currency', catname: 'Groceries, Rent...', pattern: 'e.g. NO FRILLS', month: 'which month', splitWith: 'shared with', person: 'who paid back'}
  }
};
let lang = 'uk';
try { lang = localStorage.getItem('lang') === 'en' ? 'en' : 'uk'; } catch {}
const t = k => I[lang][k];

let mermaidLib = null, erdN = 0;
async function renderErd(){
  const box = document.getElementById('erd'), f = I[lang].f, r = I[lang].rel;
  try {
    if (!mermaidLib){
      mermaidLib = (await import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs')).default;
      await document.fonts.ready;
      mermaidLib.initialize({
        startOnLoad: false, theme: 'base', fontFamily: '"IBM Plex Sans", sans-serif', er: { useMaxWidth: true },
        themeVariables: {
          fontFamily: '"IBM Plex Sans", sans-serif', fontSize: '14px',
          primaryColor: '#e8d4a0', primaryTextColor: '#241c12', primaryBorderColor: '#241c12',
          lineColor: '#c8372d', textColor: '#241c12', tertiaryColor: '#fbf6ea',
          attributeBackgroundColorOdd: '#fbf6ea', attributeBackgroundColorEven: '#f4ecdd'
        }
      });
    }
    const { svg } = await mermaidLib.render('erd-svg-' + (++erdN), `erDiagram
  CARDS ||--o{ TRANSACTIONS : "${r[0]}"
  CATEGORIES ||--o{ TRANSACTIONS : "${r[1]}"
  CATEGORIES ||--o{ CATEGORIES : "${r[2]}"
  CATEGORIES ||--o{ CATEGORY_RULES : "${r[3]}"
  CARDS {
    int id PK
    text name "${f.names}"
    text card_type "${f.type}"
    text split_with "${f.splitWith}"
    real split_share "${f.share}"
  }
  TRANSACTIONS {
    int id PK
    int card_id FK
    int category_id FK
    text date
    text time
    text holder "${f.holder}"
    text description "${f.desc}"
    text merchant "${f.merchant}"
    int amount_cents "${f.amount}"
    int orig_cents "${f.orig}"
    text kind "purchase, payment..."
  }
  CATEGORIES {
    int id PK
    text name "${f.catname}"
    int parent_id FK
  }
  CATEGORY_RULES {
    int id PK
    text pattern "${f.pattern}"
    int category_id FK
    text merchant
  }
  REPAYMENTS {
    int id PK
    text person "${f.person}"
    text date
    int amount_cents
    text for_month "${f.month}"
  }`);
    box.innerHTML = svg;
    const el = box.querySelector('svg');
    el?.setAttribute('role', 'img'); el?.setAttribute('aria-label', t('erdAria'));
  } catch (e) {
    box.innerHTML = `<p class="erd-fallback">${t('erdFail')}</p>`;
  }
}

function apply(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  renderErd();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-lang]');
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch {}
  apply();
});
apply();
</script>
</body>
</html>
