<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Справа про зниклі гроші · досьє</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.bg='aged';document.documentElement.dataset.board='scraps';</script>
<style>
:root{
  /* Чернетка у стилі «нуарного досьє»: темний стіл, манільський папір, чорнило, латунь, сургуч */
  --desk:#14120e; --desk-warm:#1c160d; --brass:#c9a15a; --brass-dk:#7a5c26; --gold-lt:#e2c181; --cream:#efe7d6; --wax:#c8372d;
  --cork:var(--desk); --cork-a:rgba(201,161,90,.05); --cork-b:rgba(0,0,0,.25);
  --paper:#f4ecdd; --paper-line:rgba(36,28,18,.09); --manila:#f4ecdd; --manila-edge:#d9c088;
  --tape:#e8d4a0;
  --ink:#241c12; --ink-soft:#5e4e36; --red:#b02e25; --string:#c8372d;
  --note-y:#e8d4a0; --note-p:#f3d2c6; --note-m:#dfe0c4; --note-b:#e4dccb; --note-l:#eadcb9;
  --hl:rgba(201,161,90,.42);
  --shadow:0 1px 0 rgba(0,0,0,.35), 0 16px 34px rgba(0,0,0,.55);
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --hand:"Playfair Display", Georgia, serif;
  --hand-s:19px; --hand-m:22px; --hand-l:32px;
  --card:#fbf6ea; --ok:#3f5f2a; --pen:#7a5c26;
  --on-cork:var(--cream);
  --head:"Playfair Display", Georgia, serif;
  color-scheme:light;
  --rule:rgba(201,161,90,.45); --kicker:var(--brass); --hint:var(--gold-lt); --grain:rgba(255,255,255,.025);
}
/* Фон — «старий папір» */
:root[data-bg="aged"]{
  --on-cork:var(--ink); --rule:rgba(36,28,18,.28); --kicker:var(--brass-dk); --hint:#5e4e36; --grain:rgba(36,28,18,.05);
  --shadow:0 1px 0 rgba(36,28,18,.12), 0 12px 26px rgba(70,45,15,.28);
}
:root[data-bg="aged"]{--desk:#e6d6b0; --desk-warm:#efe3c6}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font:16px/1.45 "IBM Plex Sans", system-ui, sans-serif;
  background:
    radial-gradient(var(--cork-a) 1px, transparent 1.7px) 0 0/9px 9px,
    radial-gradient(var(--cork-b) 1.3px, transparent 2.2px) 4px 6px/14px 14px,
    radial-gradient(var(--cork-a) .8px, transparent 1.4px) 2px 3px/23px 17px,
    var(--cork);
  overflow-x:hidden;
}
.wrap{max-width:1100px; margin:0 auto; padding:36px 16px 72px}
button{font:inherit; color:inherit}
.paper{background:var(--paper); box-shadow:var(--shadow); border-radius:3px}
.muted{color:var(--ink-soft)}
.hl{background:linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 92%, transparent 92%); padding:0 .1em}

/* ---- стікер-мітки розділів ---- */
.section{margin-top:64px}
.tape{
  display:inline-block; position:relative; margin:0 0 22px; padding:6px 22px 4px;
  font:700 clamp(22px,4vw,30px)/1.1 var(--head); letter-spacing:.04em; text-transform:uppercase;
  background:var(--tape); transform:rotate(-1.4deg); box-shadow:0 3px 8px rgba(0,0,0,.18);
  clip-path:polygon(2% 0,98% 4%,100% 50%,97% 100%,1% 95%,0 45%);
}
.tape + .hint{display:block; margin:-14px 0 20px 6px; font:600 var(--hand-s)/1.1 var(--hand); color:var(--on-cork)}

/* ---- обкладинка справи ---- */
.folder{position:relative; background:var(--manila); border-radius:4px 14px 8px 8px; padding:34px clamp(18px,4vw,40px) 72px;
  box-shadow:var(--shadow); border-bottom:6px solid var(--manila-edge)}
.folder::before{content:""; position:absolute; top:-24px; left:26px; width:190px; height:26px; background:var(--manila); border-radius:12px 12px 0 0}
.case-no{font:15px var(--mono); letter-spacing:.12em; color:var(--ink-soft)}
.folder h1{margin:6px 0 4px; font:700 clamp(38px,8vw,76px)/1 var(--head); text-transform:uppercase; letter-spacing:.01em}
.folder .lead{margin:0 0 22px; font-size:clamp(16px,2.4vw,19px); max-width:36em}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px 18px; margin:0; font-family:var(--mono)}
.facts dt{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}
.facts dd{margin:2px 0 0; font-size:16px; border-bottom:1px dashed rgba(43,40,51,.35); padding-bottom:4px}
.stamp{position:absolute; font:700 20px/1 var(--head); letter-spacing:.12em; text-transform:uppercase; color:var(--red);
  border:3px double var(--red); padding:8px 12px 6px; border-radius:6px; opacity:.82; mix-blend-mode:multiply; pointer-events:none}
.folder .stamp{top:26px; right:22px; transform:rotate(9deg)}
.sticky{position:absolute; right:clamp(10px,4vw,46px); bottom:-34px; width:190px; padding:16px 14px 14px; background:var(--note-y);
  font:700 var(--hand-m)/1 var(--hand); transform:rotate(4deg); box-shadow:var(--shadow)}
.sticky::before{content:""; position:absolute; top:-10px; left:50%; width:70px; height:20px; margin-left:-35px; background:var(--tape); transform:rotate(-3deg)}

/* ---- фільтри ---- */
.filters{margin-top:64px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; transform:rotate(-.4deg)}
.chips{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.chips:empty{display:none}
.dates{gap:8px}
.dates[hidden]{display:none}
.dates label{display:inline-flex; align-items:center; gap:6px; font:12px var(--mono); letter-spacing:.06em; color:var(--ink-soft)}
.date-in{border:2px solid var(--ink); border-radius:999px; padding:3px 10px; background:transparent; color:var(--ink); font:700 14px var(--mono)}
.date-in:focus-visible{outline:3px solid var(--red); outline-offset:2px}
.chips-label{font:12px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-right:4px; min-width:58px}
.chip{border:2px solid var(--ink); background:transparent; border-radius:999px; padding:4px 13px; cursor:pointer; font-weight:700; font-size:14px;
  transition:transform .15s, background .15s}
.chip:hover{transform:translateY(-1px) rotate(-1deg)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.chip:focus-visible,.t-row:focus-visible,.btn:focus-visible,.more:focus-visible{outline:3px solid var(--red); outline-offset:2px}

/* ---- дошка доказів ---- */
.board{position:relative; padding-top:10px}
.strings{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:visible}
.strings path{fill:none; stroke:var(--string); stroke-width:2.2; stroke-linecap:round; filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.pin{position:absolute; width:18px; height:18px; border-radius:50%; left:50%; margin-left:-9px; z-index:3;
  background:radial-gradient(circle at 35% 32%, #ff9aa8, var(--red) 55%, #7e0b1b); box-shadow:0 3px 4px rgba(0,0,0,.35)}
.victim{position:relative; z-index:2; width:min(330px,100%); margin:0 auto 76px; padding:22px 18px 20px; text-align:center; transform:rotate(-1.2deg)}
.victim .pin.top{top:-8px} .victim .pin.bottom{bottom:-8px}
.v-emoji{font-size:58px; line-height:1}
.v-label{font:12px var(--mono); letter-spacing:.2em; color:var(--red); margin-top:6px}
.v-name{font:700 34px/1.1 var(--head); text-transform:uppercase}
.v-loss{font-size:17px; margin-top:4px}
.suspects{position:relative; z-index:2; display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:40px 26px}
.suspect{position:relative; background:var(--card); padding:12px 12px 14px; box-shadow:var(--shadow); transform:rotate(var(--tilt));
  transition:transform .25s cubic-bezier(.3,1.6,.5,1); cursor:zoom-in}
.suspect:hover{transform:rotate(0) translateY(-6px) scale(1.04); z-index:4}
.suspect .pin{top:-9px}
.mug{position:relative; height:128px; display:grid; place-items:center; overflow:hidden;
  background:repeating-linear-gradient(to bottom, transparent 0 21px, rgba(43,40,51,.22) 21px 22px), var(--mug)}
.mug-emoji{font-size:66px; line-height:1; filter:drop-shadow(0 4px 2px rgba(0,0,0,.15)); transition:transform .3s}
.suspect:hover .mug-emoji{transform:rotate(-8deg) scale(1.08)}
.plate{position:absolute; bottom:7px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--card); font:12px var(--mono); padding:2px 9px; letter-spacing:.08em}
.suspect h3{margin:10px 0 0; font:700 var(--hand-m)/1 var(--hand); color:var(--ink)}
.alias{margin:2px 0 8px; font-size:14px; font-style:italic; color:var(--ink-soft)}
.suspect dl{display:flex; gap:14px; margin:0; font-family:var(--mono); color:var(--ink)}
.suspect dt{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
.suspect dd{margin:0; font-size:15px; font-weight:700}
.suspect .stamp{top:16px; right:-14px; font-size:12px; padding:5px 7px 3px; transform:rotate(14deg); background:rgba(255,255,255,.75); mix-blend-mode:normal; opacity:.95}
.empty{font:700 var(--hand-m) var(--hand); color:var(--on-cork); text-align:center}

/* ---- експертиза ---- */
.sheet{padding:26px clamp(16px,3vw,32px) 22px; position:relative;
  background:repeating-linear-gradient(to bottom, transparent 0 33px, var(--paper-line) 33px 34px), var(--paper);
  background-position:0 18px}
.sheet::before{content:""; position:absolute; top:0; bottom:0; left:clamp(8px,2vw,20px); border-left:2px solid rgba(211,38,60,.28)}
.forensics{list-style:none; margin:0; padding:0 0 0 12px; display:grid; gap:14px}
.forensics li{display:grid; grid-template-columns:44px minmax(0,1.3fr) minmax(0,2fr) auto; gap:12px; align-items:center}
.f-emoji{font-size:30px; text-align:center}
.f-name b{display:block; font-size:17px}
.f-name small{font-size:14px; font-style:italic; color:var(--ink-soft)}
.f-bar{height:22px; position:relative}
.f-bar span{display:block; height:100%; border-radius:4px 10px 6px 12px / 12px 6px 10px 4px; opacity:.9; transform:skewX(-6deg);
  transform-origin:left; animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.f-amt{font:700 16px var(--mono); text-align:right; white-space:nowrap}
.f-amt small{display:block; font-weight:400; font-size:12px; color:var(--ink-soft)}
@keyframes grow{from{transform:skewX(-6deg) scaleX(0)}}

/* ---- хронологія ---- */
.timeline{list-style:none; margin:0; padding:0 0 0 12px; display:grid; gap:6px; font-family:var(--mono)}
.t-row{width:100%; display:grid; grid-template-columns:minmax(120px,170px) 1fr auto; grid-template-areas:"m bar s" "m big big"; gap:2px 14px; align-items:center;
  text-align:left; background:transparent; border:2px dashed transparent; border-radius:8px; padding:8px 10px; cursor:pointer; transition:background .15s}
.t-row:hover{background:rgba(255,212,0,.16)}
.t-row[aria-pressed="true"]{border-color:var(--red); background:rgba(211,38,60,.06)}
.t-m{grid-area:m; font-size:17px; font-weight:700; text-transform:uppercase; letter-spacing:.04em}
.t-m i{display:block; font-style:normal; font-weight:400; font-size:12px; text-transform:none; color:var(--ink-soft); letter-spacing:0}
.t-bar{grid-area:bar; height:16px; background:repeating-linear-gradient(90deg, rgba(43,40,51,.12) 0 8px, transparent 8px 12px)}
.t-bar span{display:block; height:100%; background:var(--ink); animation:grow .8s cubic-bezier(.2,.8,.2,1) both; transform-origin:left}
.t-s{grid-area:s; font-weight:700; white-space:nowrap}
.t-big{grid-area:big; font-size:13px; color:var(--ink-soft)}

/* ---- режим приватності ---- */
.priv-right{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.priv-row{display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; border-top:1px dashed rgba(43,40,51,.25); padding-top:10px}
.schema-link{text-decoration:none; color:var(--ink); display:inline-flex; align-items:center; gap:6px}
.schema-link[hidden]{display:none}
.schema-link:focus-visible{outline:3px solid var(--red); outline-offset:2px}
.priv{display:inline-flex; align-items:center; gap:8px; border:2px solid var(--ink); background:transparent; border-radius:999px; padding:5px 14px 5px 6px; cursor:pointer; font-weight:800; font-size:14px}
.priv .knob{width:34px; height:20px; border-radius:999px; background:rgba(43,40,51,.2); position:relative; transition:background .2s}
.priv .knob::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--card); box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .2s}
.priv[aria-pressed="true"] .knob{background:var(--red)}
.priv[aria-pressed="true"] .knob::after{transform:translateX(14px)}
.priv:focus-visible{outline:3px solid var(--red); outline-offset:2px}
.tw{white-space:nowrap; letter-spacing:.06em; font-family:var(--mono); color:var(--ink);
  text-shadow:.5px 0 0 rgba(43,40,51,.85), -.3px .3px 0 rgba(43,40,51,.3)}
/* у великих заголовках X-и набрані тим самим шрифтом, що й заголовок */
h1 .tw, .due .tw, .v-name .tw{font-family:inherit; letter-spacing:.02em; text-shadow:none}
.due strong .tw{font-size:1em; text-transform:none}
.is-private .actions{display:none}
.lang{display:inline-flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; font:700 12px var(--mono)}
.lang button{border:0; background:transparent; padding:4px 11px; color:var(--ink); cursor:pointer; letter-spacing:.08em}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.lang button:focus-visible{outline:3px solid var(--red); outline-offset:-3px}

/* ---- постанова ---- */
.doc{position:relative; max-width:760px; margin:0 auto; padding:clamp(24px,5vw,48px) clamp(18px,5vw,56px) 34px; font-family:var(--mono); font-size:15px; transform:rotate(.4deg)}
.doc .pin{top:-9px}
.doc-meta{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--ink-soft); margin:0}
.doc h3{text-align:center; margin:22px 0 18px; font:700 34px/1 var(--head); letter-spacing:.14em}
.doc h3 small{display:block; margin-top:6px; font:14px var(--mono); letter-spacing:.04em; color:var(--ink-soft)}
.doc p{margin:0 0 12px; text-align:justify; hyphens:auto}
.due{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:22px 0; padding:14px 18px; border:2px solid var(--ink); border-radius:6px; background:rgba(255,212,0,.18)}
.due span{font-size:14px; letter-spacing:.14em; text-transform:uppercase}
.due strong{font:700 clamp(34px,7vw,48px)/1 var(--head)}
.pay-table{width:100%; border-collapse:collapse; margin:8px 0 16px; font-size:14px}
.pay-table th{text-align:left; font-weight:400; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); border-bottom:2px solid var(--ink); padding:4px 6px}
.pay-table td{padding:7px 6px; border-bottom:1px dashed rgba(43,40,51,.3)}
.pay-table .num{text-align:right; white-space:nowrap}
.pay-table .ok{color:var(--ok); font-weight:700}
.empty-month{text-align:center; font:700 var(--hand-m)/1.15 var(--hand); margin:18px 0}
.pay-table tfoot td{font-weight:700; border-bottom:0}
.pending{font-size:13px; color:var(--ink-soft); border-left:3px solid var(--hl); padding-left:10px}
.sign{display:flex; justify-content:flex-end; align-items:baseline; gap:10px; margin-top:26px}
.signature{font:700 var(--hand-l)/1 var(--hand); color:var(--pen); transform:rotate(-6deg); display:inline-block}
.doc .stamp{right:clamp(10px,4vw,40px); top:96px; font-size:24px; transform:rotate(12deg)}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:24px}
.btn{border:2px solid var(--ink); background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:8px; cursor:pointer; font:700 15px "IBM Plex Sans", sans-serif;
  box-shadow:0 4px 0 rgba(0,0,0,.25); transition:transform .1s, box-shadow .1s}
.btn.ghost{background:transparent; color:var(--ink)}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.25)}

/* ---- матеріали справи ---- */
.log-head{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:12px; padding-left:12px}
.log-filters{display:flex; flex-wrap:wrap; gap:10px; flex:1 1 420px}
.cat-select{flex:0 1 230px; cursor:pointer}
.forensics li[data-cat]{cursor:pointer; border-radius:8px; transition:background .15s}
.forensics li[data-cat]:hover{background:rgba(255,212,0,.16)}
.forensics li[data-cat]:focus-visible{outline:3px solid var(--red); outline-offset:2px}
.search{flex:1 1 240px; max-width:380px; border:2px solid var(--ink); border-radius:8px; padding:8px 12px; background:var(--card); font:15px var(--mono); color:var(--ink)}
.log-count{font:13px var(--mono); color:var(--ink-soft)}
.log{list-style:none; margin:0; padding:0 0 0 12px; font-family:var(--mono)}
.log li{display:grid; grid-template-columns:62px 34px minmax(0,1fr) auto; gap:10px; align-items:center; padding:7px 0; border-bottom:1px dashed rgba(43,40,51,.25)}
.l-date{font-size:13px; line-height:1.2}
.l-date small{color:var(--ink-soft)}
.l-emoji{font-size:22px; text-align:center}
.l-main{min-width:0}
.l-main b{display:block; font-family:"IBM Plex Sans", sans-serif; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.l-main small{display:block; font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.l-amt{font-weight:700; white-space:nowrap}
.l-amt.neg{color:var(--ok)}
.l-amt{text-align:right}
.l-orig{display:block; font-weight:400; font-size:12px; color:var(--ink-soft)}
.more{display:block; margin:16px auto 0; background:transparent; border:2px dashed var(--ink); border-radius:8px; padding:8px 18px; cursor:pointer; font:700 14px var(--mono)}

footer{margin-top:60px; text-align:center}
footer .paper{display:inline-block; padding:12px 18px; font:13px var(--mono); transform:rotate(-1deg); max-width:100%}
footer code{background:rgba(43,40,51,.08); padding:1px 5px; border-radius:4px}

.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,120px); background:var(--ink); color:var(--card); padding:10px 18px; border-radius:10px;
  font-weight:700; transition:transform .3s cubic-bezier(.3,1.5,.5,1); z-index:10}
.toast.show{transform:translate(-50%,0)}

@media (max-width:700px){
  .folder{padding-bottom:26px}
  .folder .stamp{position:static; display:inline-block; margin-top:16px; transform:rotate(-4deg)}
  .sticky{position:absolute; right:12px; bottom:-22px; width:150px; padding:12px 10px 10px; font-size:var(--hand-s)}
  .victim{margin-bottom:40px}
  .suspects{grid-template-columns:repeat(2,minmax(0,1fr)); gap:30px 14px}
  .mug{height:96px} .mug-emoji{font-size:48px}
  .suspect h3{font-size:var(--hand-s)}
  .suspect dl{flex-direction:column; gap:2px}
  .suspect .stamp{display:none}
  .forensics li{grid-template-columns:34px minmax(0,1fr) auto; grid-template-areas:"e n a" "b b b"}
  .f-emoji{grid-area:e; font-size:24px} .f-name{grid-area:n} .f-amt{grid-area:a} .f-bar{grid-area:b; height:14px}
  .t-row{grid-template-columns:1fr auto; grid-template-areas:"m s" "bar bar" "big big"}
  .doc .stamp{position:static; display:inline-block; margin-top:8px; transform:rotate(-6deg)}
  .doc p{text-align:left}
  .pay-table .opt{display:none}
  .log li{grid-template-columns:52px minmax(0,1fr) auto} .l-emoji{display:none}
}

/* ================= стиль «нуарне досьє» (чернетка) ================= */
.ico{display:block; fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; overflow:visible}
.ico .p{fill:var(--card)} .ico .k{fill:var(--ink)} .ico .w{fill:var(--wax)} .ico .b{fill:var(--brass)}
.mug-emoji{filter:drop-shadow(0 3px 2px rgba(36,28,18,.25))}
.mug-emoji .ico{width:72px; height:72px}
.v-emoji .ico{width:68px; height:68px; margin:0 auto}
body{background:
    radial-gradient(ellipse 110% 60% at 50% 0%, rgba(201,161,90,.10), transparent 70%),
    radial-gradient(var(--grain) 1px, transparent 1.6px) 0 0/7px 7px,
    linear-gradient(var(--desk-warm), var(--desk) 40%)}
.paper{border-radius:2px; box-shadow:var(--shadow), inset 0 0 0 1px rgba(36,28,18,.08)}
.section{counter-increment:exhibit}
.tape{display:block; background:none; transform:none; clip-path:none; box-shadow:none; padding:0 0 12px; margin:0 0 6px;
  font:700 clamp(28px,4.6vw,40px)/1.08 var(--head); text-transform:none; letter-spacing:-.01em; color:var(--on-cork);
  border-bottom:1px solid var(--rule)}
.tape::before{content:"№ " counter(exhibit, decimal-leading-zero); display:block; margin-bottom:10px;
  font:500 12px/1 var(--mono); letter-spacing:.24em; color:var(--kicker)}
.tape + .hint{margin:8px 0 24px; font:italic 500 var(--hand-s)/1.3 var(--hand); color:var(--hint)}

/* обкладинка: заголовок на всю ширину, факти в один ряд, печатка вгорі праворуч, стікер унизу */
.folder{
  background:
    radial-gradient(ellipse at 80% 40%, rgba(255,255,255,.35), transparent 60%),
    repeating-linear-gradient(0deg, rgba(36,28,18,.018) 0 2px, transparent 2px 4px), var(--manila);
  border-radius:2px 12px 2px 2px; border-bottom:6px solid var(--manila-edge); padding-bottom:92px}
.folder::before{background:var(--manila); width:200px}
.case-no{color:var(--brass-dk); letter-spacing:.2em; text-transform:uppercase; font-size:13px}
.folder h1{font:700 clamp(40px,7.4vw,78px)/1.02 var(--head); text-transform:none; letter-spacing:-.015em; margin:10px 0 14px}
.folder .lead{color:var(--ink-soft); max-width:44em}
.facts dd{border-bottom:1px solid rgba(36,28,18,.22)}
.stamp{font-family:var(--mono); font-weight:700; letter-spacing:.18em; color:var(--wax); border:3px double var(--wax); border-radius:3px}
.folder .stamp{top:26px; right:26px; transform:rotate(8deg)}
.sticky{width:216px; text-wrap:balance; background:var(--tape); font:italic 600 var(--hand-m)/1.15 var(--hand); color:var(--ink); transform:rotate(3deg);
  border-radius:2px 2px 2px 14px; padding:18px 16px 14px 30px}
.sticky{white-space:pre-line; font:500 28px/1.15 'Caveat', 'Segoe Script', cursive; letter-spacing:.01em; color:#2a3a6b}
.sticky::before{top:14px; left:12px; width:10px; height:10px; margin:0; border-radius:50%; background:var(--desk); transform:none; box-shadow:inset 0 0 0 2px var(--brass-dk)}

/* фільтри */
.filters{transform:none}
.chip{border-width:1.5px; font-weight:600}
.chip:hover{transform:translateY(-1px)}
.priv[aria-pressed="true"] .knob{background:var(--wax)}

/* дошка: шпильки-сургуч, картки підозрюваних на папері */
.pin{background:radial-gradient(circle at 35% 30%, #e0574b, var(--wax) 55%, #7d1f18); box-shadow:0 3px 5px rgba(0,0,0,.5)}
.victim .v-label{color:var(--wax); letter-spacing:.24em}
.v-name{font:700 36px/1.1 var(--head); text-transform:none}
.mug{background:repeating-linear-gradient(to bottom, transparent 0 21px, rgba(36,28,18,.2) 21px 22px), color-mix(in srgb, var(--mug) 30%, var(--paper))}
.plate{background:var(--ink); color:var(--cream)}
.suspect h3{font:italic 600 var(--hand-m)/1.1 var(--hand)}
.suspect .stamp{background:rgba(251,246,234,.85)}
.empty{font:italic 600 var(--hand-m) var(--hand)}

/* експертиза, хронологія, постанова */
.sheet::before{border-left:1px solid rgba(200,55,45,.35)}
.f-bar span{border-radius:1px; transform:none; opacity:1}
@keyframes grow{from{transform:scaleX(0)}}
.t-row:hover,.forensics li[data-cat]:hover{background:rgba(201,161,90,.16)}
.t-row[aria-pressed="true"]{border-color:var(--wax); background:rgba(200,55,45,.06)}
.t-bar span{background:var(--brass-dk)}
.doc{transform:none}
.doc h3{font:700 36px/1.05 var(--head); letter-spacing:.02em}
.due{border-width:1px; border-radius:2px; background:rgba(201,161,90,.18)}
.due strong{font-family:var(--head)}
.empty-month{font:italic 600 var(--hand-m)/1.2 var(--hand)}
.signature{font:italic 600 var(--hand-l)/1 var(--hand)}
.btn{background:var(--wax); border-color:var(--wax); color:#fff6ea; border-radius:2px; box-shadow:0 3px 0 #7d1f18; font-weight:600}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--ink); box-shadow:none}
.search{border-width:1.5px; border-radius:2px}
.more{border-radius:2px}
footer .paper{transform:none}
.toast{background:#1b1813; color:var(--cream); border:1px solid var(--brass); border-radius:2px}

@media (max-width:700px){
  .folder{padding-bottom:30px}
  .mug-emoji .ico{width:54px; height:54px}
  .folder .stamp{position:static; display:inline-block; margin-top:16px; transform:rotate(-4deg)}
  .sticky{width:200px; font-size:25px; position:relative; right:auto; bottom:auto; margin:18px 0 -6px auto}
}

/* ================= дошка доказів: клаптики старого паперу ================= */
:root[data-board]:not([data-board="big"]) .victim{width:min(250px,100%); margin-bottom:56px; padding:14px 14px 14px}
:root[data-board]:not([data-board="big"]) .v-emoji .ico{width:46px; height:46px}
:root[data-board]:not([data-board="big"]) .v-name{font-size:26px}
:root[data-board]:not([data-board="big"]) .v-loss{font-size:15px}
:root[data-board]:not([data-board="big"]) .suspect h3{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

    repeating-linear-gradient(to bottom, transparent 0 21px, rgba(70,110,170,.08) 21px 22px)}
:root[data-board="scraps"] .suspect:hover{transform:rotate(0) translateY(-3px)}
:root[data-board="scraps"] .suspect .pin{top:-6px}
:root[data-board="scraps"] .mug{height:40px; width:40px; background:none; overflow:visible}
:root[data-board="scraps"] .mug-emoji{filter:none}
:root[data-board="scraps"] .mug-emoji .ico{width:38px; height:38px}
:root[data-board="scraps"] .plate, :root[data-board="scraps"] .alias{display:none}
:root[data-board="scraps"] .suspect h3{font-size:20px; margin:0}
:root[data-board="scraps"] .suspect dl{flex-direction:row; gap:14px; margin-top:3px}

/* потерпілий — більший клаптик, щоб виділявся над підозрюваними */
html:root[data-board="scraps"]:not([data-board="big"]) .victim{width:min(340px,100%); padding:24px 22px 28px; margin-bottom:64px}
html:root[data-board="scraps"]:not([data-board="big"]) .v-emoji .ico{width:84px; height:84px}
html:root[data-board="scraps"]:not([data-board="big"]) .v-label{font-size:13px; margin-top:8px}
html:root[data-board="scraps"]:not([data-board="big"]) .v-name{font-size:40px}
html:root[data-board="scraps"]:not([data-board="big"]) .v-loss{font-size:18px; margin-top:6px}

/* ================= шрифти: лише два + рукопис =================
   Playfair Display — заголовки й імена; IBM Plex Sans — увесь інший текст і цифри;
   Caveat — тільки рукописне (стікер, підпис). Моноширинний лишився лише для зачорнених сум. */
:root{--mono:"IBM Plex Sans", system-ui, sans-serif; --body:"IBM Plex Sans", system-ui, sans-serif}
body{font-variant-numeric:tabular-nums}
.tw{font-family:"IBM Plex Mono", ui-monospace, monospace}
.tape + .hint{font:400 16px/1.45 var(--body); font-style:normal}
.tape::before{font:600 12px/1 var(--body); letter-spacing:.16em}
.case-no{font:600 13px var(--body); letter-spacing:.14em}
.facts dt, .chips-label, .dates label, .pay-table th{font-weight:600; letter-spacing:.08em}
.facts dd{font-size:16px}
.suspect h3{font-style:normal; font-weight:700}
html:root[data-board] .suspect dt{font-size:11px; font-weight:600; letter-spacing:.06em}
html:root[data-board] .suspect dd{font-weight:700}
html:root[data-board="scraps"]:not([data-board="big"]) .v-name{font-style:normal}
.v-label{font-weight:600; letter-spacing:.18em}
.plate{font-weight:600; letter-spacing:.06em}
.t-m{letter-spacing:.06em}
.empty, .empty-month{font:600 18px/1.4 var(--body); font-style:normal}
.signature{font:600 40px/1 'Caveat', 'Segoe Script', cursive; color:#2a3a6b}
.stamp{font-family:var(--body); font-weight:700; letter-spacing:.16em}

/* потерпілий — наліпка «Нерозкрита справа» (як етикетка на пакеті з доказами) */
#victim.vlabel{width:min(440px,100%); padding:0; margin:0 auto 64px; text-align:left; background:#fdfbf6; border-radius:10px;
  box-shadow:0 1px 0 rgba(36,28,18,.1), 0 10px 24px rgba(70,45,15,.28); filter:none; transform:rotate(-1.5deg)}
#victim.vlabel::before{display:none}
#victim.vlabel .pin.top{display:none}
#victim.vlabel .pin.bottom{bottom:-8px}
.vl-head{display:flex; align-items:center; gap:12px; padding:14px 18px 6px; font:700 13px/1 var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--wax); white-space:nowrap}
.vl-head::before, .vl-head::after{content:""; flex:1; height:4px; border-radius:2px; background:var(--wax)}
.vl-body{display:grid; grid-template-columns:116px minmax(0,1fr); gap:16px; align-items:center; padding:8px 18px 20px}
.vl-photo{aspect-ratio:4/5; display:grid; place-items:center; border:1.5px solid rgba(36,28,18,.35);
  background:repeating-linear-gradient(45deg, rgba(36,28,18,.045) 0 2px, transparent 2px 6px), #f4f1ea}
.vl-photo .ico{width:96px; height:96px; filter:grayscale(1) contrast(.9) opacity(.82)}
.vl-fields{margin:0; display:grid; gap:7px}
.vl-fields div{display:grid; grid-template-columns:84px minmax(0,1fr); align-items:end; gap:8px}
.vl-fields dt{font:500 13px/1.2 var(--body); color:var(--ink-soft)}
.vl-fields dd{margin:0; padding:0 2px 1px; font:500 26px/1.15 'Caveat', 'Segoe Script', cursive; color:#2a3a6b;
  border-bottom:1.5px solid rgba(36,28,18,.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.vl-fields dd .tw{font-size:16px}
@media (max-width:480px){
  .vl-body{grid-template-columns:84px minmax(0,1fr); gap:12px; padding:6px 14px 16px}
  .vl-photo .ico{width:70px; height:70px}
  .vl-fields div{grid-template-columns:70px minmax(0,1fr)}
  .vl-fields dd{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<body>
<main class="wrap">

  <header class="folder">
    <div class="case-no" id="caseNo"></div>
    <h1 id="title">Про зниклі гроші</h1>
    <p class="lead" data-i18n="lead"></p>
    <dl class="facts" id="facts"></dl>
    <span class="stamp" id="coverStamp">Цілком таємно</span>
    <div class="sticky" aria-hidden="true" data-i18n="sticky"></div>
  </header>

  <nav class="filters paper" data-i18n-aria="filters">
    <div class="chips dates" id="chipsDates">
      <span class="chips-label" data-i18n="chDates"></span>
      <label><span data-i18n="dFrom"></span> <input type="date" class="date-in" id="dFrom"></label>
      <label><span data-i18n="dTo"></span> <input type="date" class="date-in" id="dTo"></label>
    </div>
    <div class="chips" id="chipsCard"></div>
    <div class="chips" id="chipsView"></div>
    <div class="priv-row">
      <span class="priv-right">
        <a class="chip schema-link" href="schema.html" data-i18n="schemaLink"></a>
        <a class="chip schema-link" href="income.html" data-i18n="incomeLink"></a>
      </span>
      <div class="priv-right">
        <div class="lang" role="group" aria-label="Мова / Language">
          <button data-lang="uk" aria-pressed="true" lang="uk">UA</button><button data-lang="en" aria-pressed="false" lang="en">EN</button>
        </div>
        <button class="priv" id="priv" aria-pressed="false" data-i18n-title="privTitle">
          <span class="knob" aria-hidden="true"></span><span data-i18n="priv"></span>
        </button>
      </div>
    </div>
  </nav>

  <section class="section" aria-labelledby="h-board">
    <h2 class="tape" id="h-board" data-i18n="hBoard"></h2>
    <span class="hint" data-i18n="hintBoard"></span>
    <div class="board" id="board">
      <svg class="strings" id="strings" aria-hidden="true"></svg>
      <div class="victim paper" id="victim"></div>
      <div class="suspects" id="suspects"></div>
    </div>
  </section>

  <section class="section" aria-labelledby="h-forensics">
    <h2 class="tape" id="h-forensics" data-i18n="hForensics"></h2>
    <span class="hint" data-i18n="hintForensics"></span>
    <div class="sheet paper"><ul class="forensics" id="forensics"></ul></div>
  </section>

  <section class="section" aria-labelledby="h-timeline">
    <h2 class="tape" id="h-timeline" data-i18n="hTimeline"></h2>
    <span class="hint" data-i18n="hintTimeline"></span>
    <div class="sheet paper"><ul class="timeline" id="timeline"></ul></div>
  </section>

  <section class="section" id="verdictSec" aria-labelledby="h-verdict">
    <h2 class="tape" id="h-verdict" data-i18n="hVerdict"></h2>
    <span class="hint" id="verdictHint">спільні карти, все навпіл</span>
    <article class="doc paper" id="verdict"></article>
  </section>

  <section class="section" aria-labelledby="h-log">
    <h2 class="tape" id="h-log" data-i18n="hLog"></h2>
    <span class="hint" data-i18n="hintLog"></span>
    <div class="sheet paper">
      <div class="log-head">

};
const EMO = {'🛒':'cart','📦':'box','👕':'shirt','👗':'dress','🥕':'carrot','🥦':'greens','💄':'lipstick','💊':'pill','🥑':'bowl','🥗':'bowl','🫐':'bowl',
  '🥡':'noodles','🥟':'noodles','🍜':'noodles','🍝':'noodles','☕':'coffee','🍟':'fries','🍕':'pizza','🛍️':'bag','🪙':'coin','💸':'receipt','🪑':'chair',
  '🥫':'can','🔧':'wrench','🎨':'palette','🖨️':'printer','🚆':'train','🚇':'train','🧺':'basket','🏠':'house','💡':'bulb','🎉':'party','📺':'tv',
  '✈️':'plane','📚':'books','🎁':'gift','🏦':'bank','🫶':'heart','💙':'heart','📱':'phone','🏋️':'dumbbell','🎟️':'ticket','🤷':'unknown','❓':'unknown','👛':'wallet'};
const icon = e => `<svg class="ico" viewBox="0 0 64 64" aria-hidden="true">${IC[EMO[e]] || IC.receipt}</svg>`;
const TILT = [-2.4,1.8,-1.2,2.5,-2,1.3,-1.6,2.1,-.8,1.5];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('uk-UA', {minimumFractionDigits:2, maximumFractionDigits:2});
const nfEn0 = new Intl.NumberFormat('en-CA', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmt = n => (S.lang === 'en' ? nfEn0 : nf).format(n);
// realMoney — завжди справжня сума (для копіювання); money — для показу, у режимі приватності зачорнена
const realMoney = n => (n < 0 ? '−' : '') + '$' + fmt(Math.abs(n));
// Друкарська машинка: завжди однаковий шаблон «$XXX.XX», щоб за довжиною не можна було вгадати суму
const redact = (cur = '$') => `<span class="tw" role="img" aria-label="${tr('hidden')}">${cur}XXX.XX</span>`;
const money = n => S.priv ? redact() : realMoney(n);
const CUR = {UAH: '₴', USD: 'US$', PLN: 'zł '};
const origMoney = (n, c) => (n < 0 ? '−' : '') + (CUR[c] || c + ' ') + fmt(Math.abs(n));
const money0 = n => S.priv ? redact() : '$' + Math.round(n).toLocaleString(S.lang === 'en' ? 'en-CA' : 'uk-UA');
const plural = (n, f) => { const a = Math.abs(Math.round(n)) % 100, b = a % 10;
  return (a > 10 && a < 20) ? f[2] : b === 1 ? f[0] : (b > 1 && b < 5) ? f[1] : f[2]; };
const pn = (n, kind) => { const f = FORMS[kind][S.lang]; return `${n} ${S.lang === 'en' ? (n === 1 ? f[0] : f[1]) : plural(n, f)}`; };
const dShort = d => S.lang === 'en' ? `${MON_EN_S[+d.slice(5,7) - 1]} ${+d.slice(8)}` : `${+d.slice(8)} ${MON_S[+d.slice(5,7) - 1]}`;
const dFull = d => `${d.slice(8)}.${d.slice(5,7)}.${d.slice(0,4)}`;
const sum = a => Math.round(a.reduce((s, x) => s + x.a, 0) * 100) / 100;
const night = t => !!t && (t >= '23:00' || t < '05:00');
const who = h => h || tr('unknown');
const cap = s => s[0].toUpperCase() + s.slice(1);
const monLabel = m => (S.lang === 'en' ? MON_EN : MON)[+m.slice(5) - 1];
function group(arr, f){
  const m = new Map();
  for (const x of arr){ const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return [...m].map(([k, items]) => ({k, items, n:items.length, s:sum(items)})).sort((a, b) => b.s - a.s);
}

const dates = D.tx.map(x => x.d).sort();
const MIN = dates[0], MAX = dates[dates.length - 1];
const months = [...new Set(D.tx.map(x => x.d.slice(0, 7)))].sort();
// За замовчуванням — поточний місяць; якщо за нього ще немає даних — останній місяць із даними
const NOW = new Date();
const THIS_MONTH = `${NOW.getFullYear()}-${String(NOW.getMonth() + 1).padStart(2, '0')}`;
// Період — діапазон дат S.from…S.to у межах даних.
// S.month похідний: 'all' — увесь період, 'YYYY-MM' — рівно один місяць, 'range' — довільний діапазон.
const LO = MIN, HI = MAX;
const mFrom = m => `${m}-01`;
const mTo = m => { const [y, mo] = m.split('-').map(Number); return `${m}-${String(new Date(y, mo, 0).getDate()).padStart(2, '0')}`; };
const clampD = (v, def) => !v ? def : v < LO ? LO : v > HI ? HI : v;
function setRange(f, t){
  f = clampD(f, LO); t = clampD(t, HI);
  if (f > t) [f, t] = [t, f];
  S.from = f; S.to = t;
  const m = f.slice(0, 7);
  S.month = f === LO && t === HI ? 'all'
    : m === t.slice(0, 7) && f === clampD(mFrom(m), LO) && t === clampD(mTo(m), HI) ? m : 'range';
}
const pickMonth = m => m === 'all' ? setRange(LO, HI) : setRange(mFrom(m), mTo(m));
pickMonth(months.includes(THIS_MONTH) ? THIS_MONTH : (months.at(-1) || 'all'));
const cards = [...new Set(D.tx.map(x => x.c))].sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
function partial(m){
  const [y, mo] = m.split('-').map(Number);
  const last = `${m}-${String(new Date(y, mo, 0).getDate()).padStart(2, '0')}`;
  return MIN > `${m}-01` || MAX < last;
}
// «Тільки мої»: зі спільних карт рахуємо лише мою частину (частку іншої людини віднімаємо)
const mine = x => S.view === 'mine' && x.s ? {...x, a: x.a * (1 - x.s)} : x;   // округлюємо тільки підсумки, не кожну покупку
const base = ignoreMonth => D.tx.filter(x =>
  (S.card === 'all' || x.c === S.card) && (ignoreMonth ? x.d >= LO && x.d <= HI : x.d >= S.from && x.d <= S.to)).map(mine);

/* ---------- обкладинка ---------- */
function renderCover(){
  const tx = base(), total = sum(tx), ds = tx.map(x => x.d).sort();
  $('#caseNo').innerHTML = `${tr('caseNo')} ${S.priv ? redact('') : Math.round(total)}-${MAX.slice(2,4)}`;
  $('#coverStamp').textContent = S.priv ? tr('stampSecret') : tr('stampTop');
  document.body.classList.toggle('is-private', S.priv);
  $('#priv').setAttribute('aria-pressed', S.priv);
  $('#title').innerHTML = `${tr('title')} <span class="hl">${money0(total)}</span>`;
  const period = S.month === 'all'
    ? (ds.length ? `${dShort(ds[0])} — ${dShort(ds.at(-1))} ${MAX.slice(0,4)}` : '—')
    : S.month === 'range' ? `${dShort(S.from)} — ${dShort(S.to)} ${S.to.slice(0,4)}`
    : `${monLabel(S.month)} ${S.month.slice(0,4)}`;
  $('#facts').innerHTML = [
    [tr('fPeriod'), period], [tr('fEpisodes'), tx.length],
    [tr('fCards'), S.priv ? pn(cards.length, 'acc') : S.card !== 'all' ? S.card : cards.length > 3 ? pn(cards.length, 'acc') : cards.join(', ')], [tr('fCounting'), S.view === 'mine' ? tr('countMine') : tr('countAll')], [tr('fDetective'), D.owner]
  ].map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('');
}

/* ---------- фільтри ---------- */
function renderChips(){
  const mk = (k, v, label) => `<button class="chip" data-k="${k}" data-v="${esc(v)}" aria-pressed="${S[k] === v}">${esc(label)}</button>`;
  for (const [id, v] of [['#dFrom', S.from], ['#dTo', S.to]]){
    const el = $(id); el.min = LO; el.max = HI; el.value = v;
  }
  $('#chipsView').innerHTML = D.splitWith
    ? `<span class="chips-label">${tr('chCounting')}</span>` + mk('view', 'all', tr('chAllExp')) + mk('view', 'mine', tr('chMine')) : '';

    ? `<span class="chips-label">${tr('chCard')}</span>` + mk('card', 'all', tr('chAll')) + cards.map(c => mk('card', c, c)).join('') : '';

/* ---------- дошка ---------- */
function alias(s){
  const c = cat(s.items[0].cat), max = Math.max(...s.items.map(x => x.a)), avg = s.s / s.n;
  const nn = s.items.filter(x => night(x.t)).length;
  if (s.n >= 10) return tr('aRepeat');
  if (max >= 150) return tr('aOneHit');
  if (s.n >= 2 && nn / s.n >= .5) return tr('aNight');
  if (s.n >= 3 && avg < 12) return tr('aPetty');
  if (s.n === 1) return tr('aOnce');
  return catAlias(s.items[0].cat);
}
function renderBoard(){
  const tx = base(), total = sum(tx);
  // потерпілий — наліпка «Нерозкрита справа»: фото-ескіз і поля, заповнені від руки
  const caseNum = `${S.priv ? redact('') : Math.round(total)}-${MAX.slice(2, 4)}`;
  $('#victim').className = 'victim vlabel';
  $('#victim').innerHTML = `<span class="pin top"></span>
    <div class="vl-head"><span>${tr('unsolved')}</span></div>
    <div class="vl-body">
      <div class="vl-photo"><svg class="ico" viewBox="0 0 64 64" aria-hidden="true">${IC.piggy}</svg></div>
      <dl class="vl-fields">
        <div><dt>${tr('vVictim')}</dt><dd>${tr('wallet')}</dd></div>
        <div><dt>${tr('vDept')}</dt><dd>${tr('vDeptVal')}</dd></div>
        <div><dt>${tr('vCase')}</dt><dd>${caseNum}</dd></div>
        <div><dt>${tr('vLoss')}</dt><dd>${money(total)}</dd></div>
      </dl>
    </div><span class="pin bottom"></span>`;
  const g = group(tx, x => x.m).slice(0, 8), top = g[0]?.s || 1;
  $('#suspects').innerHTML = g.map((s, i) => {
    const c = cat(s.items[0].cat);
    return `<article class="suspect" style="--tilt:${TILT[i % TILT.length]}deg; --h:${Math.max(0, s.s / top).toFixed(3)}">
      <span class="pin"></span>
      <div class="mug" style="--mug:${c.c}"><span class="mug-emoji" aria-hidden="true">${icon(face(s.k, s.items[0].cat))}</span><span class="plate">№ ${String(i + 1).padStart(2, '0')}</span></div>
      <div class="info"><h3>${esc(merch(s.k))}</h3><p class="alias">«${alias(s)}»</p>
      <dl><div><dt>${tr('episodes')}</dt><dd>${s.n}</dd></div><div><dt>${tr('stolen')}</dt><dd>${money(s.s)}</dd></div></dl></div>
      ${i === 0 ? `<span class="stamp">${tr('prime')}</span>` : ''}
    </article>`;
  }).join('') || `<p class="empty">${tr('noSuspects')}</p>`;
}
function drawStrings(){
  const svg = $('#strings'), board = $('#board');
  if (window.innerWidth < 700){ svg.innerHTML = ''; return; }
  const br = board.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${br.width} ${br.height}`);
  const pinV = $('#victim .pin.bottom').getBoundingClientRect();
  const x1 = pinV.left + pinV.width / 2 - br.left, y1 = pinV.top + pinV.height / 2 - br.top;
  svg.innerHTML = [...document.querySelectorAll('.suspect .pin')].map(p => {
    const r = p.getBoundingClientRect();
    const x2 = r.left + r.width / 2 - br.left, y2 = r.top + r.height / 2 - br.top;
    return `<path d="M${x1} ${y1} Q${(x1 + x2) / 2} ${(y1 + y2) / 2 + 46} ${x2} ${y2}"/>`;
  }).join('');
}

/* ---------- хронологія ---------- */
function renderTimeline(){
  const tx = base(true);
  const g = months.map(m => { const items = tx.filter(x => x.d.startsWith(m)); return {m, items, s:sum(items)}; });
  const max = Math.max(1, ...g.map(x => x.s));
  $('#timeline').innerHTML = g.map(x => {
    const big = x.items.reduce((a, b) => !a || b.a > a.a ? b : a, null);
    return `<li><button class="t-row" data-month="${x.m}" aria-pressed="${S.month !== 'all' && x.m >= S.from.slice(0, 7) && x.m <= S.to.slice(0, 7)}">

    reps: 'Paid back',
    pending: (sum, cards, P, share) => `Still under investigation: about ${sum} in purchases the bank hasn't charged yet (${cards}). ${P}'s share (≈ ${share}) will go into the settlement for the month the bank charges them.`,
    empty: m => `In ${MON_EN[+m.slice(5) - 1]} the bank charged nothing for the shared cards. Nothing to settle 🎉`,
    emptyRange: 'In this period the bank charged nothing for the shared cards. Nothing to settle 🎉',
    sign: 'Detective', stampDue: 'Payment due', stampPaid: 'Paid',
    copyAmount: 'Copy amount', copyMsg: P => `Copy message for ${P}`,
    msg: (period, cards, paid, share, repaid, owes) => `Hi! ${cap(period)}, ${paid} was charged to my account for our shared cards (${cards}). ` +
      `Your half is ${share}` + (repaid ? `, and ${repaid} of it is already paid back` : '') + `. Left to send: ${owes} 🙏`
  }
};

let MESSAGE = '', AMOUNT = '';
function renderVerdict(){
  const P = D.splitWith;
  if (!P){ $('#verdictSec').hidden = true; return; }
  const t = L[S.lang];
  // розрахунок іде по місяцях списання: беремо всі місяці, які зачіпає обраний діапазон
  const rm = [S.from.slice(0, 7), S.to.slice(0, 7)], inM = m => m >= rm[0] && m <= rm[1];
  const one = S.month !== 'all' && rm[0] === rm[1] ? rm[0] : null;   // рівно один місяць — розрахунок за нього
  const all = !one, whole = S.month === 'all';
  const show = n => S.priv ? redact() : t.money(n);
  const r2 = n => Math.round(n * 100) / 100;
  const rows = D.debtMonthly.filter(r => inM(r.month));
  const pays = D.payments.filter(p => inM(p.d.slice(0, 7))).sort((a, b) => a.d.localeCompare(b.d));
  const reps = D.repayments.filter(r => inM(r.month));
  const paid = r2(rows.reduce((s, r) => s + r.paid, 0)), share = r2(rows.reduce((s, r) => s + r.share, 0));
  const repaid = r2(rows.reduce((s, r) => s + r.repaid, 0)), owes = r2(rows.reduce((s, r) => s + r.owes, 0));
  const when = whole ? t.whenAll : one ? t.whenMonth(one) : t.periodAll(t.date(mFrom(rm[0])), t.date(mTo(rm[1])));
  const cards = esc(D.splitCards.join(', '));
  $('#verdictHint').textContent = whole ? tr('hintVerdictAll') : one ? tr('hintVerdictMonth', one) : tr('hintVerdictRange');

  const today = new Date().toISOString().slice(0, 10);
  const head = `<span class="pin"></span>
    <p class="doc-meta"><span>${t.city}</span><span>${t.date(today)}</span></p>
    <h3>${t.title}<small>${esc(t.sub(when))}</small></h3>`;
  const sign = `<div class="sign"><span>${t.sign}</span><span class="signature">${esc(D.owner)}</span></div>`;
  const pend = D.pending.reduce((s, p) => s + p.a, 0), pendShare = D.pending.reduce((s, p) => s + p.a * p.share, 0);
  const pendHtml = pend > 0 && rm[1] >= months.at(-1)
    ? `<p class="pending">${t.pending(show(pend), esc(D.pending.map(p => p.card).join(', ')), esc(P), show(pendShare))}</p>` : '';
  $('#verdict').lang = S.lang;

  if (!rows.length){
    AMOUNT = MESSAGE = '';
    $('#verdict').innerHTML = `${head}<p class="empty-month">${one ? t.empty(one) : t.emptyRange}</p>${pendHtml}${sign}`;
    return;
  }

  const closed = owes <= 0, ds = pays.map(p => p.d);
  const period = all ? t.periodAll(t.date(ds[0]), t.date(ds.at(-1))) : (S.lang === 'en' ? `in ${t.month(one)} ${one.slice(0, 4)}` : when);
  AMOUNT = Math.max(0, owes).toFixed(2);
  MESSAGE = t.msg(period, D.splitCards.join(', '), t.money(paid), t.money(share), repaid > 0 ? t.money(repaid) : '', t.money(Math.max(0, owes)));

  const th = all ? t.thAll : t.thMonth;
  const table = all
    ? `<thead><tr><th>${th[0]}</th><th class="num opt">${th[1]}</th><th class="num">${th[2]}</th><th class="num">${th[3]}</th></tr></thead>
       <tbody>${rows.map(r => `<tr><td>${t.month(r.month)}</td><td class="num opt">${show(r.paid)}</td>
         <td class="num">${show(r.share)}</td><td class="num${r.owes <= 0 ? ' ok' : ''}">${r.owes <= 0 ? t.paidMark : show(r.owes)}</td></tr>`).join('')}</tbody>
       <tfoot><tr><td>${t.total}</td><td class="num opt">${show(paid)}</td><td class="num">${show(share)}</td><td class="num">${show(Math.max(0, owes))}</td></tr></tfoot>`
    : `<thead><tr><th>${th[0]}</th><th class="opt">${th[1]}</th><th class="num">${th[2]}</th><th class="num">${th[3]}</th></tr></thead>
       <tbody>${pays.map(p => `<tr><td>${t.date(p.d)}</td><td class="opt">${esc(p.card)}</td><td class="num">${show(p.paid)}</td><td class="num">${show(p.share)}</td></tr>`).join('')}</tbody>
       <tfoot><tr><td>${t.total}</td><td class="opt"></td><td class="num">${show(paid)}</td><td class="num">${show(share)}</td></tr></tfoot>`;

  $('#verdict').innerHTML = `${head}
    <p>${t.p1(esc(period), esc(D.owner), cards, `<b>${show(paid)}</b>`)}</p>
    <p>${t.p2(esc(P), `<b>${show(share)}</b>`, `<b>${show(repaid)}</b>`)}</p>
    <div class="due"><span>${closed ? t.closed : esc(t.owes(P))}</span><strong>${show(Math.max(0, owes))}</strong></div>
    <table class="pay-table">${table}</table>
    ${reps.length ? `<p>${t.reps}: ${reps.map(r => `${t.date(r.d)} — ${show(r.a)}`).join('; ')}.</p>` : ''}
    ${pendHtml}${sign}
    <span class="stamp">${closed ? t.stampPaid : t.stampDue}</span>
    <div class="actions">
      <button class="btn" data-copy="amount">${t.copyAmount}</button>
      <button class="btn ghost" data-copy="message">${esc(t.copyMsg(P))}</button>
    </div>`;
}

/* ---------- матеріали справи ---------- */
function renderLog(){
  const q = S.q.trim().toLowerCase();
  const all = base();
  // фільтр за категорією: тільки категорії, які є у вибраному місяці/карті
  const cats = group(all, x => x.cat).map(g => g.k).sort((a, b) => catName(a).localeCompare(catName(b), S.lang));
  if (S.logCat !== 'all' && !cats.includes(S.logCat)) S.logCat = 'all';
  $('#catFilter').innerHTML = `<option value="all">${tr('allCats')}</option>` +
    cats.map(c => `<option value="${esc(c)}"${c === S.logCat ? ' selected' : ''}>${cat(c).e} ${esc(catName(c))}</option>`).join('');
  const tx = all.filter(x => (S.logCat === 'all' || x.cat === S.logCat) &&
      (!q || [x.m, x.desc, x.cat, x.sub, x.h, S.priv ? null : x.c].some(v => v && v.toLowerCase().includes(q))))
    .sort((a, b) => (b.d + (b.t || '')).localeCompare(a.d + (a.t || '')));
  $('#logCount').innerHTML = `${pn(tx.length, 'ep')} · ${money(sum(tx))}`;
  $('#log').innerHTML = tx.slice(0, S.shown).map(x => `<li>
    <span class="l-date">${dShort(x.d)}${x.t ? `<br><small>${x.t}</small>` : ''}</span>
    <span class="l-emoji" aria-hidden="true">${cat(x.cat).e}</span>
    <span class="l-main"><b>${esc(merch(x.m))}</b><small>${esc(catName(x.sub || x.cat))} · ${esc(who(x.h))}${S.priv ? '' : ` · ${esc(x.c)}`}${x.s && S.view === 'mine' ? ` · ${tr('myShare', Math.round((1 - x.s) * 100))}` : ''}${night(x.t) ? ' · 🌙' : ''}</small></span>
    <span class="l-amt${x.a < 0 ? ' neg' : ''}">${money(x.a)}${x.oc && x.oc !== 'CAD' ? `<small class="l-orig">${S.priv ? redact(CUR[x.oc] || x.oc + ' ') : origMoney(x.o, x.oc)}</small>` : ''}</span></li>`).join('') || `<li><span></span><span></span><span class="l-main">${tr('nothingFound')}</span><span></span></li>`;
  $('#more').hidden = tx.length <= S.shown;
}

function render(){
  applyStatic(); renderChips(); renderCover(); renderBoard(); renderForensics(); renderTimeline(); renderVerdict(); renderLog();
  $('#footer').innerHTML = tr('footer', esc(D.generated));
  requestAnimationFrame(drawStrings);
}

/* ---------- події ---------- */
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 1800); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(tr('copied'));
}
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip && chip.dataset.k){
    if (chip.dataset.k === 'month') pickMonth(chip.dataset.v); else S[chip.dataset.k] = chip.dataset.v;
    S.shown = 30;
    if (chip.dataset.k === 'view') try { localStorage.setItem('view', S.view); } catch {}
    render(); return;
  }
  const row = e.target.closest('.t-row');
  if (row){ pickMonth(S.month === row.dataset.month ? 'all' : row.dataset.month); S.shown = 30; render(); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp){ copy(cp.dataset.copy === 'amount' ? AMOUNT : MESSAGE); return; }
  const lb = e.target.closest('[data-lang]');
  if (lb){ S.lang = lb.dataset.lang; try { localStorage.setItem('lang', S.lang); } catch {} render(); return; }
  if (e.target.closest('#priv')){
    S.priv = !S.priv;
    if (S.priv) S.card = 'all';          // фільтр за картою сховано — не лишаємо його ввімкненим
    try { localStorage.setItem('privacy', S.priv ? '1' : '0'); } catch {}
    render(); toast(S.priv ? tr('privOn') : tr('privOff')); return;
  }
  if (e.target.id === 'more'){ S.shown += 30; renderLog(); }
});
// вибір дат: порожнє поле = межа даних; якщо «з» пізніше за «по» — міняємо місцями
function onDate(){ setRange($('#dFrom').value, $('#dTo').value); S.shown = 30; render(); }
['#dFrom', '#dTo'].forEach(id => $(id).addEventListener('change', onDate));
$('#search').addEventListener('input', e => { S.q = e.target.value; S.shown = 30; renderLog(); });
$('#catFilter').addEventListener('change', e => { S.logCat = e.target.value; S.shown = 30; renderLog(); });
// клік по категорії в «Висновку експертизи» -> показати її покупки в матеріалах справи
function openCategory(li){
  S.logCat = li.dataset.cat; S.shown = 30; renderLog();
  document.getElementById('h-log').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}
$('#forensics').addEventListener('click', e => { const li = e.target.closest('li[data-cat]'); if (li) openCategory(li); });
$('#forensics').addEventListener('keydown', e => {
  const li = e.target.closest('li[data-cat]');
  if (li && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openCategory(li); }
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawStrings, 120); });
document.fonts && document.fonts.ready.then(drawStrings);

render();
</script>
